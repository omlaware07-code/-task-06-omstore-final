<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmStore | E-Commerce</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
  <div class="logo">OmStore 🛍️</div>

  <nav>
    <a href="#products">Products</a>
    <a href="#cart">Cart (<span id="cartCount">0</span>)</a>
    <button id="loginBtn">Login</button>
  </nav>
</header>

<section class="hero">
  <h1>Welcome to OmStore</h1>
  <p>Simple & Modern Online Shopping</p>
  <a href="#products">Shop Now</a>
</section>

<section id="products" class="section">
  <h2>Products</h2>

  <div class="filters">
    <input id="searchInput" type="text" placeholder="Search products...">

    <select id="categoryFilter">
      <option value="all">All Categories</option>
    </select>
  </div>

  <div id="productList" class="products"></div>
</section>

<section id="cart" class="section">
  <h2>Shopping Cart</h2>

  <div id="cartItems"></div>

  <h3>Total: ₹<span id="cartTotal">0</span></h3>

  <button id="checkoutBtn">Checkout</button>
</section>

<section class="section">
  <h2>Product Management</h2>

  <form id="productForm">

    <input type="hidden" id="editProductId">

    <input
      id="productName"
      type="text"
      placeholder="Product Name"
      required
    >

    <input
      id="productPrice"
      type="number"
      placeholder="Price"
      min="1"
      required
    >

    <input
      id="productCategory"
      type="text"
      placeholder="Category"
      required
    >

    <button type="submit">Add / Update Product</button>

  </form>

  <div id="adminProducts"></div>
</section>

<div id="loginModal" class="modal">

  <div class="modal-box">

    <button id="closeLogin" class="close">×</button>

    <h2>Login</h2>

    <form id="loginForm">

      <input
        id="email"
        type="email"
        placeholder="Email"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
        required
      >

      <button type="submit">Login</button>

    </form>

    <p id="loginMessage"></p>

  </div>

</div>

<script src="js/app.js"></script>

</body>
</html>
